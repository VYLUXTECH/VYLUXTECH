name: generate-snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: VYLUXTECH
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          color_snake: "#00D5FF"
          color_background: colorcode:'#0D1117'

      - name: Commit generated snake
        run: |
          git config user.name "VYLUX TECH Bot"
          git config user.email "bot@vyluxtech.local"
          git add dist
          git commit -m "chore: refresh contribution snake" || exit 0
          git push