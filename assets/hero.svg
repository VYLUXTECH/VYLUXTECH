<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="VYLUX TECH — Engineering Digital Realities — Kampala, Uganda">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00D5FF" stop-opacity="1"/>
      <stop offset="1" stop-color="#00D5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ce9ff"/>
      <stop offset="1" stop-color="#0090c0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="300" fill="url(#bg)"/>
  <rect width="960" height="300" fill="url(#grid)"/>
  <rect width="960" height="2" fill="url(#topline)"/>

  <!-- title bar -->
  <text x="32" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="2" fill="#6b7280">VYLUX TECH // COMPANY PROFILE</text>
  <text x="928" y="34" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="2" fill="#9ca3af">KAMPALA · UGANDA</text>

  <!-- HUD corner brackets -->
  <g stroke="#00D5FF" stroke-width="2" fill="none" opacity="0.75">
    <path d="M24 84 V60 H48"/>
    <path d="M936 84 V60 H912"/>
    <path d="M24 252 V276 H48"/>
    <path d="M936 252 V276 H912"/>
  </g>

  <!-- wordmark -->
  <text x="480" y="160" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="14" fill="#00D5FF" opacity="0.35" filter="url(#glow)">VYLUX TECH</text>
  <text x="480" y="160" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="14" fill="#ffffff">VYLUX <tspan fill="url(#cyan)">TECH</tspan></text>

  <!-- motto -->
  <text x="480" y="200" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="9" fill="#00D5FF">ENGINEERING DIGITAL REALITIES</text>

  <line x1="380" y1="222" x2="580" y2="222" stroke="#1f2937" stroke-width="1"/>

  <!-- bottom row -->
  <rect x="32" y="242" width="124" height="26" rx="13" fill="#052e16" stroke="#16a34a"/>
  <circle cx="50" cy="255" r="4" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="62" y="259" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.5" fill="#4ade80">OPERATIONAL</text>
  <text x="480" y="259" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.5" fill="#6b7280">JAYDEN MWESIGWA · FOUNDER</text>
  <text x="928" y="259" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="1" fill="#00D5FF">VYLUXTECH.COM</text>
</svg>
